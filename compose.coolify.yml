services:
  api:
    image: ${GHCR_IMAGE}:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      APP_ENVIRONMENT: production
      DATABASE_PATH: /data/tickets.sqlite3
      TRIAGE_API_KEY: ${TRIAGE_API_KEY}
      PROXYAPI_API_KEY: ${PROXYAPI_API_KEY}
      PROXYAPI_BASE_URL: ${PROXYAPI_BASE_URL:-https://api.proxyapi.ru/v1}
      PROXYAPI_MODEL: ${PROXYAPI_MODEL:-openai/gpt-6-luna}
      PROXYAPI_TIMEOUT_SECONDS: ${PROXYAPI_TIMEOUT_SECONDS:-20}
      PROXYAPI_MAX_COMPLETION_TOKENS: ${PROXYAPI_MAX_COMPLETION_TOKENS:-1200}
      PROXYAPI_TEMPERATURE: ${PROXYAPI_TEMPERATURE:-none}
      PROXYAPI_JSON_MODE: ${PROXYAPI_JSON_MODE:-schema}
      RATE_LIMIT_PER_CLIENT: ${RATE_LIMIT_PER_CLIENT:-5}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-30}
      DAILY_TOKEN_BUDGET: ${DAILY_TOKEN_BUDGET:-20000}
    expose:
      - "8000"
    volumes:
      - triage-data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  triage-data:
